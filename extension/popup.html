<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ApplyLog</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo">A</span> ApplyLog</div>
    <button id="openOptions" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <div id="setupBanner" class="banner" hidden>
    Connect your Google Sheet first.
    <button id="setupBtn" class="link-btn">Open settings →</button>
  </div>

  <div id="existingBanner" class="banner info" hidden>
    Already in your sheet. Changes will update that row.
  </div>

  <label id="resumeRow" class="resume-pick" hidden>Resume for this application
    <select id="resumePick"></select>
  </label>
  <button type="button" id="autofillBtn" class="secondary">✎ Autofill this application</button>
  <div id="autofillMsg" class="msg" role="status" aria-live="polite"></div>
  <button type="button" id="rememberBtn" class="link-btn remember">Remember my answers on this page</button>

  <form id="jobForm" autocomplete="off">
    <section>
      <h2>Job details</h2>
      <label>Job title<input id="title" required></label>
      <label>Company<input id="company" required></label>
      <label>Location<input id="location"></label>
      <label>URL<input id="url" type="url" required></label>
    </section>

    <section>
      <h2>Tracking</h2>
      <div class="row">
        <label>Status
          <select id="status">
            <option>Saved</option>
            <option>Applied</option>
            <option>Interviewing</option>
            <option>Offer</option>
            <option>Rejected</option>
            <option>Withdrawn</option>
          </select>
        </label>
        <label>Referral
          <select id="referral">
            <option>Not asked</option>
            <option>Asked</option>
            <option>Received</option>
            <option>Declined</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Connected on LinkedIn
          <select id="connected">
            <option>No</option>
            <option>Request sent</option>
            <option>Yes</option>
          </select>
        </label>
        <label>Contact name<input id="contact" placeholder="Who you know there"></label>
      </div>
      <button type="button" id="findPeople" class="ghost">Find my LinkedIn connections at this company ↗</button>
      <label>Notes<textarea id="notes" rows="2" placeholder="Salary, recruiter, next steps…"></textarea></label>
    </section>

    <button type="submit" id="saveBtn" class="primary">Add to sheet</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </form>

  <section id="outreach">
    <h2>Outreach</h2>
    <div id="dueLine" class="due" hidden></div>
    <label>Company<input id="oCompany" placeholder="Company you're reaching out to"></label>
    <ul id="people" class="people"></ul>
    <details id="addPerson">
      <summary>Add a person</summary>
      <label>Name<input id="oName"></label>
      <label>LinkedIn URL<input id="oProfileUrl" type="url" placeholder="https://www.linkedin.com/in/…"></label>
      <div class="row">
        <label>Role<input id="oRole" placeholder="Recruiter, SWE…"></label>
        <label>Status<select id="oStatus"></select></label>
      </div>
      <label>Notes<textarea id="oNotes" rows="2" placeholder="How you know them, what you said…"></textarea></label>
      <button type="button" id="oAdd" class="secondary">Add to outreach</button>
    </details>
    <div id="oMsg" class="msg" role="status" aria-live="polite"></div>
  </section>

  <script src="resumes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
